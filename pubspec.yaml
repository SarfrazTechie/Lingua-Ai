name: lingua_ai
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^14.0.0

  # Google Sign In
  google_sign_in: ^6.2.0

  # Apple Sign In
  sign_in_with_apple: ^6.0.0

  # Supabase
  supabase_flutter: ^2.3.0

  # OCR (on-device)
  google_mlkit_text_recognition: ^0.13.0

  # Local Storage
  shared_preferences: ^2.5.5
  path_provider: ^2.1.0

  # UI & Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  cached_network_image: ^3.3.0

  # Utils
  intl: 0.20.2
  uuid: ^4.4.0
  dio: ^5.4.0
  purchases_flutter: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true